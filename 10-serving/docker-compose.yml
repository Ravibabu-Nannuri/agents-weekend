# Helpdesk API + Postgres checkpointer.
#   cd 10-serving && docker compose up --build
# Keys come from the repo's .env (ANTHROPIC_API_KEY, LANGFUSE_*).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent        # local demo only - use a secret store in production
      POSTGRES_DB: agent
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: 10-serving/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
